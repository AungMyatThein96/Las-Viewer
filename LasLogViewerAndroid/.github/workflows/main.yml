name: Build debug APK

# Builds automatically on every push, and can also be triggered manually
# from the Actions tab ("Run workflow"). No local install needed at all -
# GitHub's runners provide the JDK and Android SDK.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

    - name: Build debug APK
      run: gradle -p ./LasLogViewerAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAS-Log-Viewer-debug-apk
          path: LasLogViewerAndroid/app/build/outputs/apk/debug/app-debug.apk
